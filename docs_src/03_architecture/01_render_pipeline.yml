id: PIPELINE
title: Diorite Render Architecture & Zero-Alloc Pipeline
summary: Architecture of Diorite's batch renderer, priority layering, immediate meshes, and zero-allocation memory recycling.
description: |
  Diorite uses a decoupled architecture separating procedural command issuance from GPU batch dispatch.
  Commands submitted through the DSL or generated by nodes are aggregated into thread-safe queues
  and rendered efficiently using pre-allocated vertex arrays and immediate mesh buffers.

topics:
  - title: Visual Priority
    description: "3D items use StandardMaterial3D with render_priority 127 and FlagDisableDepthTest. 2D items render in a dedicated CanvasLayer on layer 128 with z_index 4096."
  - title: ImmediateMesh Batching
    description: "All shapes are generated into unified continuous vertex arrays, dispatching to GPU in single draw calls per pass."
  - title: Lifetime Management
    description: "Commands specify a duration in seconds. Single-frame commands (duration <= 0.0) are consumed immediately; timed commands decay remaining_time until expiration."

examples:
  - title: Configuring Render Priority
    code: |
      # Draw with on-top override disabled (obeys standard depth occlusion)
      DebugDraw.box_3d(pos, size, Color.new(1, 1, 0), on_top: false)
  - title: Timed Persistence
    code: |
      # Retain hit spark for 0.75 seconds
      DebugDraw.ray_hit_3d(origin, hit_point, hit_normal, duration: 0.75)

pitfalls:
  - "Avoid modifying queue arrays directly; always use DebugDraw public methods to ensure thread safety."

faq:
  - q: How many draw calls does Diorite issue per frame?
    a: "Typically only 2 to 3 draw calls: one for depth-disabled 3D shapes, one for depth-tested 3D shapes, and one for the 2D canvas overlay."
  - q: What is the overhead of calling DebugDraw when no shapes are drawn?
    a: "Essentially zero; empty queues skip ImmediateMesh surface generation entirely."
