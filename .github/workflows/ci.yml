name: Addon CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: diorite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-addon:
    name: Diorite Addon CI
    uses: sol-vin/lapis/.github/workflows/build-addon.yml@4.8-dev7
    with:
      addon-name: diorite
      entry-point: src/main.cr
      godot-version: 4.8-dev7
      lapis-ref: 4.8-dev7
      os-matrix: '["ubuntu-latest", "windows-latest"]'
      run-specs: true
      run-headless: true
      run-benchmarks: true
