name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Generate Lapis Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Diorite Repository
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lld make gcc g++

      - name: Verify Toolchain
        run: |
          crystal -v

      - name: Install Shards
        run: |
          shards install --ignore-crystal-version || true

      - name: Build Lapis CLI
        run: |
          mkdir -p bin
          crystal build lib/lapis/tools/lapis/src/lapis.cr -o bin/lapis

      - name: Generate Lapis Documentation
        run: |
          crystal docs src/main.cr -o docs
          bin/lapis docs --skip-generate

      - name: Ensure .nojekyll
        run: |
          touch docs/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
